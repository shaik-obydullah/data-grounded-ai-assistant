name: data-grounded-ai-assistant

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-grounded-ai-assistant-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/company.ini
    networks:
      - data-grounded-ai-assistant-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=data_grounded_ai_assistant
      - DB_USERNAME=data_grounded_ai_user
      - DB_PASSWORD=company_pass
      - OLLAMA_HOST=http://ollama:11434

  nginx:
    image: nginx:alpine
    container_name: data-grounded-ai-assistant-nginx
    restart: unless-stopped
    ports:
      - "8030:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - data-grounded-ai-assistant-network
    depends_on:
      - app

  postgres:
    image: postgres:16
    container_name: data-grounded-ai-assistant-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=data_grounded_ai_assistant
      - POSTGRES_USER=data_grounded_ai_user
      - POSTGRES_PASSWORD=company_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-grounded-ai-assistant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_grounded_ai_user -d data_grounded_ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: data-grounded-ai-assistant-adminer
    restart: unless-stopped
    ports:
      - "8031:8080"
    networks:
      - data-grounded-ai-assistant-network
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama:latest
    container_name: data-grounded-ai-assistant-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - data-grounded-ai-assistant-network

networks:
  data-grounded-ai-assistant-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
